<title>[BETA] Memora Watches — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1613; --panel:#14211c; --panel-2:#1c2c25; --border:#2a3d35;
    --text:#f1efe8; --text-dim:#96a29a; --gold:#b98d55; --gold-strong:#d6ab74;
    --badge-bg:rgba(20,33,28,.85); --badge-border:rgba(214,171,116,.4);
    --shadow:0 18px 40px -14px rgba(0,0,0,.55); --danger:#c9634e;
  }
  html[data-theme="light"]{
    --bg:#f5f3ec; --panel:#ffffff; --panel-2:#eceae0; --border:#dcdace;
    --text:#18231e; --text-dim:#79847c; --gold:#8f6b38; --gold-strong:#b98d55;
    --badge-bg:rgba(255,255,255,.88); --badge-border:rgba(143,107,56,.35);
    --shadow:0 18px 40px -14px rgba(120,100,60,.25);
  }
  html, body{ transition:background-color .25s ease, color .25s ease; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; }
  .wrap{ max-width:1240px; margin:0 auto; padding:0 24px; }
  a{ color:inherit; }
  button{ font-family:inherit; }

  /* ---------- Header ---------- */
  header.site-header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
    gap:14px; padding:28px 24px 18px; max-width:1240px; margin:0 auto;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-icon{
    width:44px; height:44px; border-radius:12px; background:#ffffff;
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    padding:7px; overflow:hidden; flex-shrink:0;
  }
  .brand-icon img{ width:100%; height:100%; object-fit:contain; }
  .brand h1{ font-size:22px; }
  .brand p{ margin:2px 0 0; font-size:12.5px; color:var(--text-dim); }
  .header-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .btn{
    border-radius:9px; border:1px solid var(--border); background:var(--panel);
    color:var(--text); padding:10px 16px; font-size:13.5px; font-weight:600;
    cursor:pointer; transition:border-color .2s, transform .15s;
  }
  .btn:hover{ border-color:var(--gold); }
  .btn-gold{ background:linear-gradient(180deg, var(--gold-strong), var(--gold)); color:#1a1508; border:none; }
  .btn-gold:hover{ transform:translateY(-1px); }
  .icon-btn{ width:38px; height:38px; padding:0; display:flex; align-items:center; justify-content:center; }
  .btn-contact{
    display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 9px;
    border-radius:999px; border:none; text-decoration:none; font-weight:600; font-size:13px;
    color:#fff; cursor:pointer; transition:transform .15s, box-shadow .15s; white-space:nowrap;
  }
  .btn-contact:hover{ transform:translateY(-2px); box-shadow:0 12px 22px -12px rgba(0,0,0,.5); }
  .btn-contact-icon{
    width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .btn-whats-contact{ background:linear-gradient(135deg, #2fd86b, #1fa851); }
  /* Botões do cabeçalho (Instagram/WhatsApp): pill discreta igual aos outros
     botões do site — só o ícone carrega a cor da rede, não o botão inteiro. */
  .btn-social{
    display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 9px;
    border-radius:999px; border:1px solid var(--border); background:var(--panel);
    color:var(--text); font-weight:600; font-size:13px; text-decoration:none;
    cursor:pointer; transition:border-color .15s ease, transform .15s ease;
  }
  .btn-social:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .btn-social-icon{
    width:24px; height:24px; border-radius:50%; flex-shrink:0; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-social-icon.instagram{ background:linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7); }
  .btn-social-icon.whatsapp{ background:#25D366; }
  @media (max-width:520px){ .header-actions .btn-social{ padding:9px; } .header-actions .btn-contact-label{ display:none; } }
  .detail-actions .btn-contact{ width:100%; padding:13px 16px 13px 12px; font-size:14px; }
  .detail-actions .btn-contact-icon{ width:26px; height:26px; }

  /* ---------- Controls ---------- */
  .controls{
    display:flex; flex-wrap:wrap; gap:10px; padding:0 24px 18px; max-width:1240px; margin:0 auto;
  }
  .search-box{ position:relative; flex:1 1 240px; }
  .search-box svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55; }
  .search-box input{
    width:100%; padding:11px 34px 11px 38px; border-radius:10px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    font-family:'Inter',sans-serif; font-size:14px; outline:none;
  }
  .search-box input:focus{ border-color:var(--gold); }
  .search-clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:22px; height:22px; border-radius:50%; border:none; background:transparent;
    color:var(--text-dim); font-size:16px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .search-clear:hover{ background:var(--panel-2); color:var(--text); }
  .search-clear[hidden]{ display:none; }

  .dropdown{ position:relative; }
  .dd-trigger{
    display:flex; align-items:center; gap:8px; padding:11px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .dd-trigger:hover{ border-color:var(--gold); }
  .btn-filters{
    display:inline-flex; align-items:center; gap:8px; padding:11px 16px; border-radius:10px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap;
    transition:border-color .15s ease;
  }
  .btn-filters:hover{ border-color:var(--gold); }
  .filters-count{
    background:var(--gold); color:#1a1508; font-size:11px; font-weight:700;
    width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  #filtersModal .modal{ max-width:400px; }
  #filtersModal .field:last-of-type{ margin-bottom:20px; }

  .dd-trigger .chevron{ transition:transform .15s; opacity:.6; }
  .dd-trigger[aria-expanded="true"] .chevron{ transform:rotate(180deg); }
  .dd-menu{
    position:absolute; top:calc(100% + 6px); left:0; min-width:170px; max-height:280px; overflow-y:auto;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); z-index:20; padding:6px;
  }
  .dd-option{
    display:block; width:100%; text-align:left; padding:8px 10px; border-radius:7px;
    border:none; background:none; color:var(--text); font-size:13.5px; cursor:pointer;
  }
  .dd-option:hover{ background:var(--panel-2); }
  .dd-option.active{ color:var(--gold-strong); font-weight:600; }

  /* ---------- Grid ---------- */
  .count-line{ padding:0 24px 14px; max-width:1240px; margin:0 auto; font-size:12.5px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; }
  main.catalog-grid{
    max-width:1240px; margin:0 auto; padding:0 24px 20px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:18px;
  }
  .watch-card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden;
    display:flex; flex-direction:column; transition:border-color .2s, transform .2s;
  }
  .watch-card{ cursor:pointer; }
  .watch-card:hover{ border-color:var(--gold); transform:translateY(-2px); }
  .card-media{ position:relative; aspect-ratio:1/1; background:#fff; overflow:hidden; }
  .card-media img{ width:100%; height:100%; object-fit:cover; display:block; }
  .badge{
    position:absolute; top:10px; left:10px; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; padding:5px 9px; border-radius:999px;
    background:var(--badge-bg); color:var(--gold-strong); border:1px solid var(--badge-border);
    backdrop-filter:blur(3px); max-width:64%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .badge-sobencomenda{ color:#d6ab74; border-color:rgba(214,171,116,.5); background:rgba(214,171,116,.14); }
  .badge-emestoque{ color:#8fd19e; border-color:rgba(143,209,158,.5); background:rgba(143,209,158,.14); }
  .badge-acaminho{ color:#8ec2e8; border-color:rgba(142,194,232,.5); background:rgba(142,194,232,.14); }
  .badge-esgotado{ color:#e0937c; border-color:rgba(224,147,124,.5); background:rgba(224,147,124,.14); }
  .badge-descontinuado{ color:#a39d90; border-color:rgba(163,157,144,.45); background:rgba(163,157,144,.12); }
  .watch-card.faded{ opacity:.55; transition:opacity .2s ease; }
  .watch-card.faded:hover{ opacity:.9; }
  .popular-badge{
    position:absolute; bottom:10px; right:10px; font-size:10.5px; font-weight:700;
    padding:5px 9px; border-radius:999px; letter-spacing:.02em;
    background:linear-gradient(180deg, var(--gold-strong), var(--gold)); color:#1a1508;
    box-shadow:0 6px 14px -6px rgba(214,171,116,.7);
    max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  @media (max-width:480px){
    .popular-badge{ padding:5px 8px; font-size:9.5px; }
  }
  .gallery-arrow{
    position:absolute; top:50%; transform:translateY(-50%); width:26px; height:26px; border-radius:50%;
    background:rgba(12,22,19,.55); border:none; color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0; transition:opacity .15s;
  }
  .watch-card:hover .gallery-arrow{ opacity:1; }
  .gallery-arrow.prev{ left:8px; } .gallery-arrow.next{ right:8px; }
  .gallery-dots{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); display:flex; gap:4px; }
  .gallery-dots span{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.5); }
  .gallery-dots span.active{ background:#fff; }
  .card-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-strong); }
  .card-body h3{ font-size:16px; margin:2px 0 4px; }
  .ref{ font-size:11.5px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; margin:0 0 8px; }
  .price{ font-size:17px; font-weight:700; margin:0; }
  .price .unit{ font-size:11px; font-weight:500; color:var(--text-dim); }
  .installment-hint{ font-size:11.5px; color:var(--text-dim); margin:2px 0 0; }
  .card-actions{ margin-top:auto; display:flex; gap:8px; }
  .btn-detail{
    flex:1; padding:10px; border-radius:9px; border:1px solid var(--border); background:var(--panel-2);
    color:var(--text); font-weight:600; font-size:13px; cursor:pointer;
  }
  .btn-detail:hover{ border-color:var(--gold); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-dim); grid-column:1/-1; }

  /* ---------- Pagination ---------- */
  .pagination{ display:flex; justify-content:center; gap:8px; padding:0 24px 60px; }
  .pagination button{
    width:36px; height:36px; border-radius:8px; border:1px solid var(--border); background:var(--panel);
    color:var(--text); cursor:pointer; font-size:13px;
  }
  .pagination button.active{ background:var(--gold); color:#1a1508; border-color:var(--gold); font-weight:700; }

  /* ---------- Detail modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,12,10,.72); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:18px;
    max-width:560px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);
  }
  #detailModal{ max-height:88vh; overflow:hidden; display:flex; flex-direction:column; padding:0; }
  .detail-gallery-col{ flex-shrink:0; display:flex; flex-direction:column; }
  .detail-scroll-col{ overflow-y:auto; }
  @media (min-width:680px){
    #detailModal{ flex-direction:row; max-width:820px; max-height:min(88vh, 640px); }
    .detail-gallery-col{ width:340px; background:#fff; justify-content:center; }
    .detail-gallery{ aspect-ratio:1/1; }
    .detail-scroll-col{ flex:1; }
  }
  .modal-close{
    position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%;
    border:1px solid rgba(224,90,90,.4); background:rgba(224,90,90,.14); color:var(--danger);
    font-size:18px; line-height:1; cursor:pointer; z-index:2; padding:0;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .modal-close:hover{ background:var(--danger); color:#fff; }
  .modal-copy-link{
    position:absolute; top:14px; right:56px; width:32px; height:32px; border-radius:50%;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    cursor:pointer; z-index:2; display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .modal-copy-link:hover{ border-color:var(--gold); color:var(--gold-strong); }
  .modal-copy-link.copied{ background:var(--gold); border-color:var(--gold); color:#1a1508; }
  .detail-gallery{ position:relative; aspect-ratio:1/1; background:#fff; flex-shrink:0; }
  /* contain (e não cover) pra mostrar o relógio INTEIRO, sem cortar as bordas */
  .detail-gallery img{ width:100%; height:100%; object-fit:contain; display:block; padding:16px; }
  .detail-gallery-arrow{
    position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%;
    background:rgba(12,22,19,.55); border:none; color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:18px;
  }
  .detail-gallery-arrow:hover{ background:rgba(12,22,19,.8); }
  .detail-gallery-arrow.prev{ left:10px; } .detail-gallery-arrow.next{ right:10px; }
  .detail-thumbs{ display:flex; gap:8px; padding:12px 20px; overflow-x:auto; flex-shrink:0; }
  .detail-thumbs img{
    width:68px; height:68px; object-fit:cover; border-radius:8px; cursor:pointer;
    border:2px solid transparent; opacity:.6; flex-shrink:0;
  }
  .detail-thumbs img.active{ border-color:var(--gold); opacity:1; }
  .detail-body{ padding:26px 24px 24px; }
  .badge-inline{
    display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; padding:4px 10px; border-radius:999px; margin-bottom:12px;
    border:1px solid var(--badge-border); background:var(--badge-bg); color:var(--gold-strong);
  }
  .detail-body .eyebrow{ display:block; margin-bottom:2px; }
  .detail-body h2{ font-size:25px; line-height:1.15; margin-bottom:18px; }
  .detail-price-block{
    padding:16px 0 18px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }
  .detail-price-main{ display:flex; align-items:baseline; gap:9px; }
  .detail-price-block .price{ font-size:29px; letter-spacing:-.01em; }
  .detail-price-unit{ color:var(--text-dim); font-size:13px; }
  .spec-list{ margin:0 0 20px; }
  .spec-list > div{
    display:flex; justify-content:space-between; align-items:baseline; gap:16px;
    padding:8px 0; border-bottom:1px dashed var(--border);
  }
  .spec-list > div:last-child{ border-bottom:none; }
  .spec-list dt{ font-size:12.5px; color:var(--text-dim); }
  .spec-list dd{
    margin:0; font-size:13px; font-weight:600; text-align:right;
    font-family:'IBM Plex Mono',monospace;
  }
  .delivery-note{
    font-size:11.5px; line-height:1.5; color:var(--text-dim);
    background:var(--panel-2); border:1px solid var(--border); border-radius:9px;
    padding:10px 12px; margin:0 0 18px;
  }
  .detail-body .eyebrow{ display:block; margin-bottom:4px; }
  .detail-body h2{ font-size:22px; margin-bottom:6px; }
  .detail-body .ref{ margin-bottom:14px; }
  .detail-price-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:18px; }
  .detail-price-row .price{ font-size:24px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .field select{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:14px; outline:none;
  }
  .installment-result{ font-size:13.5px; color:var(--text-dim); margin-top:8px; }
  .strap-options{ display:flex; flex-wrap:wrap; gap:8px; }
  .strap-line{
    font-size:11.5px; font-weight:600; color:var(--gold-strong);
    margin:8px 0 0; display:flex; align-items:center; gap:5px;
  }
  .strap-line::before{
    content:''; width:6px; height:6px; border-radius:50%;
    background:var(--gold); flex-shrink:0;
  }
  .strap-option{
    padding:9px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:13px; font-weight:600;
    cursor:pointer; transition:border-color .15s, background .15s, color .15s;
  }
  .strap-option:hover{ border-color:var(--gold); }
  .strap-option.active{
    background:linear-gradient(180deg, var(--gold-strong), var(--gold));
    color:#1a1508; border-color:transparent;
  }
  .installment-result strong{ color:var(--text); font-size:15px; }
  .detail-actions{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .detail-actions .btn{ text-align:center; text-decoration:none; padding:13px; font-size:14px; }

  /* ---------- WhatsApp group floating button ---------- */
  .whats-group-btn{
    position:fixed; bottom:24px; left:24px; z-index:40;
    width:52px; height:52px; border-radius:50%;
    background:#25D366; border:none; color:#fff;
    box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .2s ease;
  }
  .whats-group-btn:hover{ transform:translateY(-3px); }
  .back-to-top{
    position:fixed; bottom:24px; right:24px; z-index:40;
    width:46px; height:46px; border-radius:50%;
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transform:translateY(10px);
    transition:opacity .2s ease, transform .2s ease, border-color .2s ease;
  }
  .back-to-top.show{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .back-to-top:hover{ border-color:var(--gold); }
  @media (max-width:640px){ .back-to-top{ right:16px; bottom:16px; } }
  .whats-popover{
    position:fixed; bottom:88px; left:24px; z-index:41; width:230px;
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:20px; box-shadow:var(--shadow); text-align:center;
  }
  .whats-popover[hidden]{ display:none; }
  .whats-popover h3{ font-family:'Fraunces',serif; font-size:16px; margin:0 0 6px; }
  .whats-popover p{ font-size:12.5px; color:var(--text-dim); margin:0 0 14px; }
  .whats-popover img{ width:150px; height:150px; border-radius:10px; margin-bottom:14px; background:#fff; padding:6px; }
  .whats-popover .btn{ width:100%; display:block; text-decoration:none; box-sizing:border-box; }

  .locked-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:24px; font-family:'Inter',sans-serif;
  }

  @media (max-width:640px){
    header.site-header{ padding:20px 16px 14px; }
    .header-actions{ width:100%; justify-content:flex-start; }
    .controls{ padding:0 16px; }
    .count-line{ padding:0 16px 14px; }
    main.catalog-grid{ padding:0 16px 20px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .pagination{ padding:0 16px; margin-bottom:40px; }
    .brand h1{ font-size:21px; }
    .whats-group-btn{ left:16px; bottom:16px; }
    .whats-popover{ left:16px; bottom:80px; width:min(230px, calc(100vw - 32px)); }
    .dd-menu{ right:0; left:auto; }
  }
</style>

      <span class="btn-contact-label">Falar com a loja</span>

<script>
(function(){
  const PAGE_SIZE = 24;
  let CATALOG = [];
  let CONFIG = { rates:{}, whatsappGroupUrl:'', whatsappSellerNumber:'', locked:false };
  let state = { search:'', brand:'Todos', size:'Todos', status:'Disponíveis', movimento:'Todos', priceRange:'Todos', sort:'popular', page:1 };

  const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#e9e4d8"/><circle cx="100" cy="100" r="55" fill="none" stroke="#b8ac8f" stroke-width="4"/><line x1="100" y1="100" x2="100" y2="65" stroke="#b8ac8f" stroke-width="4"/><line x1="100" y1="100" x2="125" y2="100" stroke="#b8ac8f" stroke-width="4"/></svg>'
  );

  // Marcas de nome composto: sem essa lista, "Christopher Ward" viraria só
  // "Christopher" no filtro. Pra adicionar uma marca nova composta, é só
  // incluir o nome aqui.
  const MARCAS_COMPOSTAS = [
    'Christopher Ward','Furlan Marri','Grand Seiko','Frederique Constant',
    'Maurice Lacroix','Raymond Weil','Dan Henry','Nivada Grenchen',
    'Studio Underd0g','Kurono Tokyo','Otsuka Lotec','Louis Erard',
    'Baume Mercier','Carl Bucherer','Massena LAB','Serica Watches'
  ];
  function nomeLimpo(name){ return String(name || '').replace(/_/g, ' ').trim(); }
  function brandOf(name){
    const limpo = nomeLimpo(name);
    const alvo = limpo.toLowerCase();
    const composta = MARCAS_COMPOSTAS.find(m =>
      alvo === m.toLowerCase() || alvo.startsWith(m.toLowerCase() + ' ')
    );
    if(composta) return composta;
    return limpo.split(' ')[0] || 'Outros';
  }
  function semMarca(name){
    const limpo = nomeLimpo(name);
    const marca = brandOf(name);
    return limpo.toLowerCase().startsWith(marca.toLowerCase())
      ? limpo.slice(marca.length).trim()
      : limpo;
  }

  function statusClass(status){
    const s = (status || '').toLowerCase();
    if(s.includes('estoque')) return 'badge-emestoque';
    if(s.includes('caminho')) return 'badge-acaminho';
    if(s.includes('esgotado')) return 'badge-esgotado';
    if(s.includes('descontinuado')) return 'badge-descontinuado';
    return 'badge-sobencomenda';
  }
  function isFadedStatus(status){
    const s = (status || '').toLowerCase();
    return s.includes('esgotado') || s.includes('descontinuado');
  }
  function formatBRL(v){ return 'R$ ' + Math.ceil(v||0).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
  function installmentAt(price, n){
    const rate = (CONFIG.rates[String(n)] || 0) / 100;
    const gross = price / (1 - rate);
    return gross / n;
  }
  // As fotos são servidas via jsDelivr (uma CDN gratuita que lê direto do
  // repositório do GitHub) em vez do link normal do site — assim elas ficam
  // disponíveis quase na hora, sem esperar o GitHub Pages publicar o site
  // inteiro (que pode demorar). Só funciona bem porque cada foto tem nome
  // único e nunca é sobrescrita, então não tem risco de "versão antiga".
  const GH_OWNER = location.hostname.split('.')[0];
  const GH_REPO = location.hostname;
  const GH_BRANCH = 'main';
  function cdnUrl(path){
    if(!path || path.startsWith('data:') || path.startsWith('http')) return path;
    return `https://cdn.jsdelivr.net/gh/${GH_OWNER}/${GH_REPO}@${GH_BRANCH}/${path}`;
  }
  // Padroniza o tamanho pra "35 mm", "35mm", "36,5mm" e "36.5mm" não virarem
  // entradas diferentes no filtro. Só afeta exibição e filtro — o dado
  // cadastrado no catálogo continua como está.
  function normalizarMedida(m){
    if(!m) return '';
    let s = String(m).trim();
    s = s.replace(/,/g, '.');                    // 36,5mm -> 36.5mm
    s = s.replace(/\s+/g, ' ');                  // espaços repetidos
    s = s.replace(/(\d)\s*(mm|m)\b/gi, '$1mm');  // "35 mm" e "38m" -> "35mm"/"38mm"
    s = s.replace(/\s*\bou\b\s*/gi, ' ou ');     // "37mm OU 39mm" -> "37mm ou 39mm"
    s = s.replace(/\s*x\s*/gi, ' x ');           // "32mmx50mm" -> "32mm x 50mm"
    return s.trim();
  }
  function ordenarMedidas(a, b){
    return (parseFloat(a) || 0) - (parseFloat(b) || 0) || a.localeCompare(b);
  }
  function imagesOf(w){ return (w.images && w.images.length) ? w.images : [PLACEHOLDER_IMG]; }
  // Monta a lista de opções de pulseira SEMPRE incluindo a versão original do
  // relógio (com o preço e as fotos principais) como primeira opção — senão
  // o cliente perderia justamente a versão padrão de vista.
  function strapsOf(w){
    if(!(w.straps && w.straps.length)) return null;
    const base = {
      nome: w.strapBaseName || 'Padrão',
      price: w.price,
      images: imagesOf(w)
    };
    return [base, ...w.straps];
  }
  const LIMIAR_MAIS_VENDIDO = 2; // mais de 2 unidades vendidas = "mais pedido"
  function popularIds(){
    return new Set(
      CATALOG.filter(w => (w.orderCount||0) > LIMIAR_MAIS_VENDIDO && !isFadedStatus(w.status)).map(w => w.id)
    );
  }

  // ---------- Load data ----------
  // Busca os dados direto do repositório (raw.githubusercontent.com), não
  // pelo link normal do site — isso não depende da publicação do GitHub
  // Pages terminar (que pode demorar), só do commit já ter acontecido.
  // O "?t=" no final força sempre a versão mais nova, sem cache nenhum.
  function rawUrl(path){
    return `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${path}?t=${Date.now()}`;
  }

  async function loadData(){
    try{
      const [catRes, cfgRes] = await Promise.all([
        fetch(rawUrl('catalog.json'), { cache:'no-store' }),
        fetch(rawUrl('config.json'), { cache:'no-store' })
      ]);
      CATALOG = await catRes.json();
      CONFIG = Object.assign(CONFIG, await cfgRes.json());
    } catch(e){
      document.getElementById('app').innerHTML =
        '<div class="locked-screen"><div><h1 style="font-size:20px;">Não foi possível carregar o catálogo</h1>' +
        '<p style="color:var(--text-dim); margin-top:8px;">Verifique sua internet e recarregue a página.</p></div></div>';
      return;
    }
    const previewOk = CONFIG.previewKey && new URLSearchParams(location.search).get('preview') === CONFIG.previewKey;
    if(CONFIG.locked && !previewOk){
      document.getElementById('app').innerHTML =
        '<div class="locked-screen"><div><h1 style="font-size:20px;">Catálogo indisponível</h1>' +
        '<p style="color:var(--text-dim); margin-top:8px;">Este link foi desativado temporariamente.</p></div></div>';
      return;
    }
    setupTheme();
    setupWhatsApp();
    renderFilterMenus();
    updateFiltersCount();
    renderSortMenu();
    render();

    // Se chegou por um link de um relógio específico (compartilhado no
    // WhatsApp/Instagram), já abre direto nele.
    const idParaAbrir = new URLSearchParams(location.search).get('r');
    if(idParaAbrir && CATALOG.find(w => w.id === Number(idParaAbrir))){
      openDetail(Number(idParaAbrir), null, true);
    }
  }

  // ---------- Theme ----------
  function updateThemeIcon(theme){
    const btn = document.getElementById('themeToggleBtn');
    btn.innerHTML = theme === 'light'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  }
  function setupTheme(){
    const theme = localStorage.getItem('memora_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', current);
      localStorage.setItem('memora_theme', current);
      updateThemeIcon(current);
    });
  }

  function setupWhatsApp(){
    const talkBtn = document.getElementById('talkSellerBtn');
    talkBtn.href = 'https://wa.me/' + CONFIG.whatsappSellerNumber + '?text=' + encodeURIComponent('Olá! Vi o catálogo da Memora Watches e queria mais informações.');

    document.getElementById('instagramBtn').href = CONFIG.instagramUrl || '#';

    document.getElementById('whatsGroupLink').href = CONFIG.whatsappGroupUrl;
    document.getElementById('whatsQr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(CONFIG.whatsappGroupUrl);

    const whatsGroupBtn = document.getElementById('whatsGroupBtn');
    const whatsPopover = document.getElementById('whatsPopover');
    whatsGroupBtn.addEventListener('click', () => { whatsPopover.hidden = !whatsPopover.hidden; });
    document.getElementById('whatsPopoverClose').addEventListener('click', () => { whatsPopover.hidden = true; });
    document.addEventListener('click', (e) => {
      if(!whatsPopover.hidden && !e.target.closest('.whats-popover') && !e.target.closest('#whatsGroupBtn')){
        whatsPopover.hidden = true;
      }
    });
  }

  // ---------- Dropdown helper ----------
  function setupDropdown(prefix, options, activeValue, onSelect){
    const trigger = document.getElementById(prefix + 'Trigger');
    const label = document.getElementById(prefix + 'TriggerLabel');
    const menu = document.getElementById(prefix + 'Menu');
    const dropdown = document.getElementById(prefix + 'Dropdown');
    menu.innerHTML = options.map(o =>
      `<button type="button" class="dd-option${o.value===activeValue?' active':''}" data-value="${o.value}">${o.label}</button>`
    ).join('');
    label.textContent = (options.find(o => o.value === activeValue) || options[0]).label;
    function close(){ menu.hidden = true; trigger.setAttribute('aria-expanded','false'); }
    trigger.onclick = (e) => {
      e.stopPropagation();
      const willOpen = menu.hidden;
      document.querySelectorAll('.dd-menu').forEach(m => m.hidden = true);
      if(willOpen){ menu.hidden = false; trigger.setAttribute('aria-expanded','true'); }
    };
    menu.querySelectorAll('.dd-option').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        onSelect(btn.dataset.value);
        label.textContent = btn.textContent;
        menu.querySelectorAll('.dd-option').forEach(o => o.classList.toggle('active', o === btn));
        close();
      };
    });
    document.addEventListener('click', (e) => {
      if(!menu.hidden && !e.target.closest('#' + prefix + 'Dropdown')) close();
    });
  }

  // Faixas de preço fixas — cobrem bem a distribuição real do catálogo hoje.
  const FAIXAS_PRECO = [
    {value:'Todos', label:'Qualquer preço', min:0, max:Infinity},
    {value:'lt5k', label:'Até R$ 5.000', min:0, max:5000},
    {value:'5-8k', label:'R$ 5.000 – R$ 8.000', min:5000, max:8000},
    {value:'8-12k', label:'R$ 8.000 – R$ 12.000', min:8000, max:12000},
    {value:'gt12k', label:'Acima de R$ 12.000', min:12000, max:Infinity},
  ];
  function faixaPreco(value){ return FAIXAS_PRECO.find(f => f.value === value) || FAIXAS_PRECO[0]; }

  function renderFilterMenus(){
    const brands = Array.from(new Set(CATALOG.map(w => brandOf(w.name)))).sort();
    const sizes = Array.from(new Set(CATALOG.map(w => normalizarMedida(w.medida)).filter(Boolean))).sort(ordenarMedidas);
    const statuses = Array.from(new Set(CATALOG.map(w => w.status || 'Sob encomenda'))).sort();
    const movimentos = Array.from(new Set(CATALOG.map(w => w.movimento).filter(Boolean))).sort();

    const preencher = (id, options, valorAtual) => {
      const sel = document.getElementById(id);
      sel.innerHTML = options.map(o => `<option value="${o.value}" ${o.value===valorAtual?'selected':''}>${o.label}</option>`).join('');
    };
    preencher('fltBrand', [{value:'Todos', label:'Todas as marcas'}, ...brands.map(b => ({value:b, label:b}))], state.brand);
    preencher('fltSize', [{value:'Todos', label:'Todos os tamanhos'}, ...sizes.map(s => ({value:s, label:s}))], state.size);
    preencher('fltStatus', [
      {value:'Disponíveis', label:'✅ Disponíveis'}, {value:'Todos', label:'Todos os status'},
      ...statuses.map(s => ({value:s, label:s}))
    ], state.status);
    preencher('fltMovimento', [{value:'Todos', label:'Todos os movimentos'}, ...movimentos.map(m => ({value:m, label:m}))], state.movimento);
    preencher('fltPriceRange', FAIXAS_PRECO.map(f => ({value:f.value, label:f.label})), state.priceRange);
  }

  function updateFiltersCount(){
    const ativos = [
      state.brand !== 'Todos', state.size !== 'Todos', state.status !== 'Todos',
      state.movimento !== 'Todos', state.priceRange !== 'Todos'
    ].filter(Boolean).length;
    const badge = document.getElementById('filtersCount');
    badge.hidden = ativos === 0;
    badge.textContent = ativos;
  }

  document.getElementById('filtersBtn').addEventListener('click', () => { document.getElementById('filtersModal').hidden = false; });
  document.getElementById('filtersModalClose').addEventListener('click', () => { document.getElementById('filtersModal').hidden = true; });
  document.getElementById('filtersCloseBtn').addEventListener('click', () => { document.getElementById('filtersModal').hidden = true; });
  document.getElementById('filtersClearBtn').addEventListener('click', () => {
    state.brand = 'Todos'; state.size = 'Todos'; state.status = 'Disponíveis';
    state.movimento = 'Todos'; state.priceRange = 'Todos'; state.page = 1;
    renderFilterMenus(); updateFiltersCount(); render();
  });
  ['fltBrand','fltSize','fltStatus','fltMovimento','fltPriceRange'].forEach(id => {
    document.getElementById(id).addEventListener('change', (e) => {
      const chave = { fltBrand:'brand', fltSize:'size', fltStatus:'status', fltMovimento:'movimento', fltPriceRange:'priceRange' }[id];
      state[chave] = e.target.value;
      state.page = 1;
      updateFiltersCount();
      render();
    });
  });

  function renderSortMenu(){
    const options = [
      {value:'popular', label:'Mais pedidos'},
      {value:'recent', label:'Mais recentes'},
      {value:'price_asc', label:'Menor preço'},
      {value:'price_desc', label:'Maior preço'},
      {value:'name_asc', label:'Nome A-Z'}, {value:'name_desc', label:'Nome Z-A'}
    ];
    setupDropdown('sort', options, state.sort, v => { state.sort = v; state.page = 1; render(); });
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    state.search = e.target.value; state.page = 1;
    document.getElementById('searchClearBtn').hidden = !e.target.value;
    render();
  });
  document.getElementById('searchClearBtn').addEventListener('click', () => {
    const input = document.getElementById('searchInput');
    input.value = ''; state.search = ''; state.page = 1;
    document.getElementById('searchClearBtn').hidden = true;
    input.focus(); render();
  });

  // ---------- Card + gallery ----------
  function cardHTML(w, popular){
    const brand = brandOf(w.name);
    const rest = semMarca(w.name);
    const imgs = imagesOf(w);
    const specs = [w.ref, normalizarMedida(w.medida)].filter(Boolean).join(' · ');
    const status = w.status || 'Sob encomenda';
    const val12 = installmentAt(w.price, 12);
    return `
    <article class="watch-card${isFadedStatus(status) ? ' faded' : ''}" data-id="${w.id}" data-photo-index="0">
      <div class="card-media">
        <img src="${cdnUrl(imgs[0])}" alt="${w.name}" loading="lazy">
        <span class="badge ${statusClass(status)}">${status}</span>
        ${popular ? '<span class="popular-badge" title="Um dos mais pedidos">Mais pedido</span>' : ''}
        ${imgs.length > 1 ? `
          <button class="gallery-arrow prev" data-dir="-1" aria-label="Foto anterior">‹</button>
          <button class="gallery-arrow next" data-dir="1" aria-label="Próxima foto">›</button>
          <div class="gallery-dots">${imgs.map((_,i) => `<span class="${i===0?'active':''}"></span>`).join('')}</div>
        ` : ''}
      </div>
      <div class="card-body">
        <span class="eyebrow">${brand}</span>
        <h3>${rest || w.name}</h3>
        ${specs ? `<p class="ref">${specs}</p>` : '<p class="ref">&nbsp;</p>'}
        <p class="price">${formatBRL(w.price)} <span class="unit">à vista</span></p>
        <p class="installment-hint">em até 12x de ${formatBRL(val12)}</p>
        ${(w.straps && w.straps.length) ? `<p class="strap-line">${w.straps.length + 1} opções de pulseira</p>` : ''}
      </div>
    </article>`;
  }

  function filteredSorted(){
    let list = CATALOG.slice();
    if(state.brand !== 'Todos') list = list.filter(w => brandOf(w.name) === state.brand);
    if(state.size !== 'Todos') list = list.filter(w => normalizarMedida(w.medida) === state.size);
    if(state.status === 'Disponíveis') list = list.filter(w => !isFadedStatus(w.status));
    else if(state.status !== 'Todos') list = list.filter(w => (w.status || 'Sob encomenda') === state.status);
    if(state.movimento !== 'Todos') list = list.filter(w => w.movimento === state.movimento);
    if(state.priceRange !== 'Todos'){
      const faixa = faixaPreco(state.priceRange);
      list = list.filter(w => w.price >= faixa.min && w.price < faixa.max);
    }
    if(state.search.trim()){
      const q = state.search.trim().toLowerCase();
      list = list.filter(w => nomeLimpo(w.name).toLowerCase().includes(q) || (w.ref||'').toLowerCase().includes(q));
    }
    if(state.sort === 'popular') list.sort((a,b) => (b.orderCount||0) - (a.orderCount||0));
    else if(state.sort === 'price_asc') list.sort((a,b) => a.price - b.price);
    else if(state.sort === 'price_desc') list.sort((a,b) => b.price - a.price);
    else if(state.sort === 'name_asc') list.sort((a,b) => a.name.localeCompare(b.name, 'pt-BR'));
    else if(state.sort === 'name_desc') list.sort((a,b) => b.name.localeCompare(a.name, 'pt-BR'));
    else list.sort((a,b) => new Date(b.postedAt||0) - new Date(a.postedAt||0));
    return list;
  }

  function render(){
    const grid = document.getElementById('grid');
    const list = filteredSorted();
    const total = list.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    state.page = Math.min(state.page, totalPages);
    const start = (state.page - 1) * PAGE_SIZE;
    const pageItems = list.slice(start, start + PAGE_SIZE);
    const popular = popularIds();

    document.getElementById('countLine').textContent = total
      ? `Mostrando ${start+1}–${Math.min(start+PAGE_SIZE, total)} de ${total} relógios`
      : '';

    grid.innerHTML = pageItems.length
      ? pageItems.map(w => cardHTML(w, popular.has(w.id))).join('')
      : '<div class="empty-state">Nenhum relógio encontrado com esses filtros.</div>';

    grid.querySelectorAll('.watch-card').forEach(card => {
      card.addEventListener('click', () => openDetail(Number(card.dataset.id)));
    });
    grid.querySelectorAll('.gallery-arrow').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const card = btn.closest('.watch-card');
        const w = CATALOG.find(x => x.id === Number(card.dataset.id));
        const imgs = imagesOf(w);
        let idx = (Number(card.dataset.photoIndex) + Number(btn.dataset.dir) + imgs.length) % imgs.length;
        card.dataset.photoIndex = idx;
        card.querySelector('img').src = cdnUrl(imgs[idx]);
        card.querySelectorAll('.gallery-dots span').forEach((d,i) => d.classList.toggle('active', i===idx));
      });
    });

    renderPagination(totalPages);
  }

  function renderPagination(totalPages){
    const el = document.getElementById('pagination');
    if(totalPages <= 1){ el.innerHTML = ''; return; }
    let html = '';
    for(let p=1; p<=totalPages; p++){
      html += `<button class="${p===state.page?'active':''}" data-page="${p}">${p}</button>`;
    }
    el.innerHTML = html;
    el.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => { state.page = Number(btn.dataset.page); render(); window.scrollTo({top:0, behavior:'smooth'}); });
    });
  }

  // ---------- Detail modal ----------
  function openDetail(id, strapInicial, fromUrl){
    const w = CATALOG.find(x => x.id === id);
    if(!w) return;

    // Atualiza o endereço do navegador pra refletir o relógio aberto — assim
    // dá pra copiar o link e compartilhar direto pra esse item específico,
    // e o botão "voltar" do navegador funciona certinho.
    const url = new URL(location.href);
    url.searchParams.set('r', id);
    if(fromUrl) history.replaceState({ watchId:id }, '', url);
    else history.pushState({ watchId:id }, '', url);

    const brand = brandOf(w.name);
    const rest = semMarca(w.name);
    const specs = [w.ref, normalizarMedida(w.medida)].filter(Boolean).join(' · ');
    const rateKeys = Object.keys(CONFIG.rates).map(Number).sort((a,b)=>a-b);

    // Pulseiras: cada uma tem nome, preço próprio e (opcionalmente) fotos próprias.
    // Relógio sem pulseiras cadastradas continua funcionando exatamente como antes.
    const straps = strapsOf(w);
    // Se o cliente clicou direto numa miniatura de pulseira no card, já abre nela.
    let currentStrap = (straps && strapInicial && strapInicial < straps.length) ? strapInicial : 0;
    let currentPhoto = 0;

    function strapAtual(){ return straps ? straps[currentStrap] : null; }
    function precoAtual(){
      const s = strapAtual();
      return (s && typeof s.price === 'number' && s.price > 0) ? s.price : w.price;
    }
    function fotosAtuais(){
      const s = strapAtual();
      if(s && s.images && s.images.length) return s.images;
      return imagesOf(w);
    }

    document.getElementById('detailModal').innerHTML = `
      <button class="modal-close" id="detailCloseBtn">&times;</button>
      <button class="modal-copy-link" id="detailCopyLinkBtn" title="Copiar link deste relógio">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
      <div class="detail-gallery-col" id="detailGalleryCol"></div>
      <div class="detail-scroll-col">
      <div class="detail-body">
        <span class="badge-inline ${statusClass(w.status)}">${w.status || 'Sob encomenda'}</span>
        <span class="eyebrow">${brand}</span>
        <h2>${rest || nomeLimpo(w.name)}</h2>

        <div class="detail-price-block">
          <div class="detail-price-main">
            <span class="price" id="detailPrice">${formatBRL(w.price)}</span>
            <span class="detail-price-unit">à vista</span>
          </div>
          <p class="installment-result" id="installmentResult"></p>
        </div>

        <dl class="spec-list">
          ${w.ref ? `<div><dt>Referência</dt><dd>${w.ref}</dd></div>` : ''}
          ${w.medida ? `<div><dt>Tamanho</dt><dd>${normalizarMedida(w.medida)}</dd></div>` : ''}
          ${w.movimento ? `<div><dt>Movimento</dt><dd>${w.movimento}</dd></div>` : ''}
          <div><dt>Condição</dt><dd>Novo, completo</dd></div>
        </dl>
        ${(w.status === 'Sob encomenda' && CONFIG.prazoEntregaDias) ? `
          <p class="delivery-note">
            Prazo estimado de entrega: até ${CONFIG.prazoEntregaDias} dias corridos.
            É uma estimativa, não um compromisso fechado — pode variar conforme disponibilidade e logística.
          </p>
        ` : ''}

        ${straps ? `
        <div class="field">
          <label>Pulseira</label>
          <div class="strap-options" id="strapOptions">
            ${straps.map((s,i) => `<button type="button" class="strap-option${i===currentStrap?' active':''}" data-i="${i}">${s.nome || ('Opção ' + (i+1))}</button>`).join('')}
          </div>
        </div>` : ''}
        <div class="field">
          <label>Simular parcelamento no cartão</label>
          <select id="installmentSelect">
            ${rateKeys.map(n => `<option value="${n}" ${n===12?'selected':''}>${n===1 ? 'À vista no cartão' : n+'x'}</option>`).join('')}
          </select>
        </div>
        <div class="detail-actions">
          <a class="btn-contact btn-whats-contact" id="detailWhatsBtn" target="_blank" rel="noopener" style="justify-content:center;">
            <span class="btn-contact-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.9 4.44-9.9 9.9 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.44 9.9-9.9 0-2.64-1.03-5.12-2.9-6.99A9.82 9.82 0 0 0 12.04 2Zm5.8 14.1c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.1.11-1.78-.11-.41-.13-.94-.3-1.62-.6-2.85-1.23-4.71-4.1-4.85-4.29-.14-.19-1.16-1.55-1.16-2.96 0-1.4.74-2.09 1-2.38.26-.28.57-.35.76-.35h.55c.18 0 .42-.07.65.5.24.58.81 2 .88 2.14.07.14.12.31.02.5-.09.19-.14.3-.28.47-.14.16-.29.36-.42.49-.14.14-.29.29-.12.57.16.28.72 1.19 1.55 1.93 1.06.94 1.96 1.24 2.24 1.38.28.14.44.12.61-.07.16-.19.7-.82.89-1.1.19-.28.37-.23.63-.14.26.09 1.65.78 1.94.93.28.14.47.21.54.33.07.12.07.68-.17 1.36Z"/></svg></span>
            <span class="btn-contact-label">Falar com vendedor sobre este relógio</span>
          </a>
        </div>
      </div>
      </div>
    `;
    document.getElementById('detailOverlay').hidden = false;
    document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);
    document.getElementById('detailOverlay').addEventListener('click', (e) => {
      if(e.target.id === 'detailOverlay') closeDetail();
    });
    document.getElementById('detailCopyLinkBtn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const link = new URL(location.href);
      link.searchParams.set('r', w.id);
      try{
        await navigator.clipboard.writeText(link.toString());
      } catch(err){
        // navegador mais antigo: seleciona um campo temporário e copia
        const temp = document.createElement('textarea');
        temp.value = link.toString();
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
      }
      btn.classList.add('copied');
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
      }, 1800);
    });

    // Galeria: redesenhada sempre que troca a pulseira, já que as fotos mudam.
    function renderGallery(){
      const imgs = fotosAtuais();
      if(currentPhoto >= imgs.length) currentPhoto = 0;
      document.getElementById('detailGalleryCol').innerHTML = `
        <div class="detail-gallery">
          <img id="detailMainImg" src="${cdnUrl(imgs[currentPhoto])}" alt="${w.name}">
          ${imgs.length > 1 ? `
            <button type="button" class="detail-gallery-arrow prev" id="detailPrevBtn" aria-label="Foto anterior">‹</button>
            <button type="button" class="detail-gallery-arrow next" id="detailNextBtn" aria-label="Próxima foto">›</button>
          ` : ''}
        </div>
        ${imgs.length > 1 ? `<div class="detail-thumbs">${imgs.map((src,i) => `<img src="${cdnUrl(src)}" class="${i===currentPhoto?'active':''}" data-i="${i}">`).join('')}</div>` : ''}
      `;
      document.querySelectorAll('.detail-thumbs img').forEach(thumb => {
        thumb.addEventListener('click', () => showPhoto(Number(thumb.dataset.i)));
      });
      const prevBtn = document.getElementById('detailPrevBtn');
      const nextBtn = document.getElementById('detailNextBtn');
      if(prevBtn) prevBtn.addEventListener('click', () => showPhoto(currentPhoto - 1));
      if(nextBtn) nextBtn.addEventListener('click', () => showPhoto(currentPhoto + 1));
    }
    function showPhoto(i){
      const imgs = fotosAtuais();
      currentPhoto = (i + imgs.length) % imgs.length;
      document.getElementById('detailMainImg').src = cdnUrl(imgs[currentPhoto]);
      document.querySelectorAll('.detail-thumbs img').forEach((t,idx) => t.classList.toggle('active', idx===currentPhoto));
    }
    renderGallery();

    if(straps){
      document.querySelectorAll('.strap-option').forEach(btn => {
        btn.addEventListener('click', () => {
          currentStrap = Number(btn.dataset.i);
          currentPhoto = 0;
          document.querySelectorAll('.strap-option').forEach(b => b.classList.toggle('active', b === btn));
          document.getElementById('detailPrice').textContent = formatBRL(precoAtual());
          renderGallery();
          updateInstallment();
        });
      });
    }

    const select = document.getElementById('installmentSelect');
    function updateInstallment(){
      const n = Number(select.value);
      const preco = precoAtual();
      const val = installmentAt(preco, n);
      document.getElementById('installmentResult').innerHTML = n === 1
        ? `À vista no cartão: <strong>${formatBRL(val)}</strong>`
        : `${n}x de <strong>${formatBRL(val)}</strong>`;
      const n2 = n === 1 ? 'à vista' : n + 'x de ' + formatBRL(val);
      const s = strapAtual();
      const descPulseira = s ? ` (pulseira ${s.nome})` : '';
      document.getElementById('detailWhatsBtn').href = 'https://wa.me/' + CONFIG.whatsappSellerNumber + '?text=' +
        encodeURIComponent(`Olá! Tenho interesse no ${nomeLimpo(w.name)}${w.ref ? ' (ref. ' + w.ref + ')' : ''}${descPulseira}. Vi o preço de ${formatBRL(preco)} (${n2}). Ainda está disponível?`);
    }
    select.addEventListener('change', updateInstallment);
    document.getElementById('detailPrice').textContent = formatBRL(precoAtual());
    updateInstallment();
  }
  function closeDetail(){
    document.getElementById('detailOverlay').hidden = true;
    // Tira o "?r=" da barra de endereço ao fechar, sem recarregar a página.
    const url = new URL(location.href);
    if(url.searchParams.has('r')){
      url.searchParams.delete('r');
      history.pushState({}, '', url);
    }
  }
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDetail(); });
  // Botão "voltar" do navegador: fecha o modal se saiu do link do relógio,
  // ou abre se voltou pra ele.
  window.addEventListener('popstate', () => {
    const id = new URLSearchParams(location.search).get('r');
    if(id && CATALOG.find(w => w.id === Number(id))){
      openDetail(Number(id), null, true);
    } else {
      document.getElementById('detailOverlay').hidden = true;
    }
  });

  loadData();
})();
</script>
